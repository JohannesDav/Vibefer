name: Build binaries

on:
  workflow_dispatch:

# Each job opts into just the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GENEFER_VARIANT: opencl
  VIBEFER_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # BOINC client_release/8.2/8.2.9; verify the tag before compiling it.
  BOINC_COMMIT: d56d870a5e7dad6c9f1a8c3b1075f11844b87ca2

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make curl unzip mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-opencl-headers mingw-w64-ucrt-x86_64-opencl-icd
      - name: Run CPU and kernel checks
        run: |
          python3 .github/scripts/test-release-files.py
          bash .github/scripts/cpu-checks.sh
      - name: Build with BOINC support
        run: bash .github/scripts/build-windows.sh
      - name: Smoke-test the Windows executable
        run: bash .github/scripts/check-banner.sh ./build/vibeferg.exe
      - name: Check DLL dependencies and package
        run: python3 .github/scripts/release-files.py windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 (glibc 2.31)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ python3 curl \
            binutils xz-utils libgmp-dev ocl-icd-opencl-dev libboinc-app-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run CPU and kernel checks
        run: |
          python3 .github/scripts/test-release-files.py
          bash .github/scripts/cpu-checks.sh
      - name: Build with BOINC support
        env:
          DEBIAN_FRONTEND: noninteractive
        run: bash .github/scripts/build-linux.sh
      - name: Check glibc and shared libraries, and package
        run: python3 .github/scripts/release-files.py linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  linux-runtime:
    name: Linux runtime checks
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux
          path: dist
      - name: Install CPU and OpenCL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make python3 libgmp-dev \
            ocl-icd-opencl-dev pocl-opencl-icd unzip
      - name: Test the packaged Linux executable
        run: |
          unzip -q dist/*.zip -d "$RUNNER_TEMP/vibefer"
          bash .github/scripts/runtime-checks-linux.sh "$RUNNER_TEMP/vibefer/vibeferg"

  downloads:
    name: Assemble build downloads
    needs: [windows, linux, linux-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare checksums and release notes
        run: python3 .github/scripts/release-files.py checksums
      - name: Attest the ZIPs
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.zip
      - name: Collect the license and provenance
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp LICENSE dist/LICENSE
          cp "$PROVENANCE" dist/provenance.sigstore.json
          cp release-notes.md dist/release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencl-build-downloads
          path: dist/
          if-no-files-found: error
          retention-days: 14
